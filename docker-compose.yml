version: '3.9'
services:
  api:
    build: .
    container_name: saas-api
    ports:
      - "8080:8080"
    environment:
      APP_PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/saas_db?sslmode=disable
      JWT_SECRET: change-me
      AWS_REGION: us-east-1
      S3_BUCKET: saas-demo-bucket
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: saas-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saas_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
