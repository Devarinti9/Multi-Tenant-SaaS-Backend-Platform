version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: saas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - saas_postgres:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - postgres
    env_file:
      - .env.example
    ports:
      - "8082:8080"

volumes:
  saas_postgres:
